function openProjectDetail(id){
  const p = DB.projects.find(x=>x.id===id); if(!p) return;
  const me = currentUser();
  const canEdit = p.ownerId===me.id || isAdmin();
  p.files = p.files || [];
  const urgColor = p.urgency==='urgent' ? 'var(--danger)' : p.urgency==='important' ? 'var(--important)' : 'var(--text-faint)';
  const siblingProjects = DB.projects.filter(x=>canSee(x, me.id)).sort((a,b)=>(a.order??1e15)-(b.order??1e15));
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal workspace-modal">
        <div class="ws-top" style="border-top:3px solid ${urgColor};">
          <input type="text" id="pd-title-input" value="${esc(p.title)}" class="ws-title-input" ${canEdit?'':'readonly'} title="${urgencyLabel(p.urgency||'normal')} öncelik">
          <div class="ws-top-actions">
            ${canEdit ? `<button class="icon-btn" id="pd-del-btn" title="Sil"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>` : ''}
            <button class="icon-btn" id="close-x">✕</button>
          </div>
        </div>
        <div class="ws-body">
          <div class="ws-col ws-col-list">
            ${siblingProjects.map(sp=>`<div class="ws-list-item ${sp.id===p.id?'active':''}" data-goto="${sp.id}"><span class="dot" style="background:${sp.urgency==='urgent'?'var(--danger)':sp.urgency==='important'?'var(--important)':'var(--text-faint)'}"></span>${esc(sp.title)}</div>`).join('')}
          </div>
          <div class="ws-col ws-col-mid">
            <textarea id="pd-desc-input" class="ws-textarea" placeholder="Buraya yaz…" ${canEdit?'':'readonly'}>${esc(p.desc||'')}</textarea>
          </div>
          <div class="ws-col-side">
            <div class="side-box">
              <div class="side-box-head">Dosyalar</div>
              <div class="file-grid" id="pd-files">
                ${p.files.map(f=>{
                  const isImg = f.type && f.type.startsWith('image/');
                  const isCover = p.coverFileId===f.id;
                  return `
                  <div class="file-chip" data-file="${f.id}">
                    ${isImg ? `<img src="${f.dataUrl}" alt="${esc(f.name)}" data-preview="${f.id}">` : `<div class="file-icon" data-preview="${f.id}">📄</div>`}
                    <div class="file-name">${esc(f.name)}</div>
                    ${isImg && canEdit ? `<button class="file-cover-btn ${isCover?'active':''}" data-cover-file="${f.id}" title="${isCover?'Kapak fotoğrafı':'Kapak yap'}">★</button>` : ''}
                    ${canEdit ? `<button class="file-del" data-del-file="${f.id}" title="Sil">✕</button>` : ''}
                  </div>`;
                }).join('')}
                ${canEdit ? `<label class="file-add"><input type="file" id="pd-file-input" multiple style="display:none;">+ Dosya</label>` : ''}
              </div>
            </div>
            <div class="side-box side-box-log">
              <div class="side-box-head">Log</div>
              <div id="pd-log-list">
                ${DB.activityLog.filter(l=>l.meta && l.meta.projectId===p.id).slice().reverse().map(l=>{
                  const label = { proje_olusturuldu:'oluşturdu', proje_duzenlendi:'düzenledi', dosya_eklendi:'dosya ekledi', dosya_silindi:'dosya sildi' }[l.action] || l.action;
                  return `<div class="log-row"><b>${esc(userById(l.userId)?.name||'—')}</b> ${label}${l.meta.fileName?` — ${esc(l.meta.fileName)}`:''}<span class="small-note">${timeAgo(l.at)}</span></div>`;
                }).join('') || '<div class="team-empty">Henüz kayıt yok</div>'}
              </div>
            </div>
          </div>
        </div>
        <div class="ws-foot">${esc(userById(p.ownerId)?.name||'—')} · ${fmtDate(p.createdAt)}${p.updatedAt && p.updatedAt!==p.createdAt ? ' · düzenlendi '+timeAgo(p.updatedAt) : ''}</div>
      </div>
    </div>`;
  const close=()=>root.innerHTML='';
  document.getElementById('close-x').onclick=close;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') close(); });
  root.querySelectorAll('[data-goto]').forEach(el=> el.addEventListener('click', ()=>{ if(el.dataset.goto!==p.id) openProjectDetail(el.dataset.goto); }));

  const delBtn = document.getElementById('pd-del-btn');
  if(delBtn) delBtn.onclick = ()=>{
    if(!confirm('Bu projeyi silmek istiyor musun?')) return;
    p.deleted = true; p.updatedAt = Date.now();
    logActivity('proje_silindi', { title:p.title, projectId:p.id });
    markDirty('projects'); close(); scheduleSave(); renderAll(); showToast('Proje silindi');
  };

  if(canEdit){
    const titleInput = document.getElementById('pd-title-input');
    const descInput = document.getElementById('pd-desc-input');
    const origTitle = p.title, origDesc = p.desc||'';
    let saveTimer = null;
    function scheduleFieldSave(){
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=>{
        p.title = titleInput.value.trim() || p.title;
        p.desc = descInput.value;
        p.updatedAt = Date.now();
        markDirty('projects'); scheduleSave();
      }, 700);
    }
    function logIfChanged(){
      if(p.title!==origTitle || (p.desc||'')!==origDesc){
        logActivity('proje_duzenlendi', { projectId:p.id, title:p.title });
        const logList = document.getElementById('pd-log-list');
        if(logList) logList.innerHTML = DB.activityLog.filter(l=>l.meta && l.meta.projectId===p.id).slice().reverse().map(l=>{
          const label = { proje_olusturuldu:'oluşturdu', proje_duzenlendi:'düzenledi', dosya_eklendi:'dosya ekledi', dosya_silindi:'dosya sildi' }[l.action] || l.action;
          return `<div class="log-row"><b>${esc(userById(l.userId)?.name||'—')}</b> ${label}${l.meta.fileName?` — ${esc(l.meta.fileName)}`:''}<span class="small-note">${timeAgo(l.at)}</span></div>`;
        }).join('') || '<div class="team-empty">Henüz kayıt yok</div>';
      }
    }
    titleInput.addEventListener('input', scheduleFieldSave);
    descInput.addEventListener('input', scheduleFieldSave);
    titleInput.addEventListener('blur', logIfChanged);
    descInput.addEventListener('blur', logIfChanged);
  }

  const fileInput = document.getElementById('pd-file-input');
  if(fileInput) fileInput.addEventListener('change', ()=>{
    const files = [...fileInput.files];
    let remaining = files.length;
    if(!remaining) return;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        p.files.push({ id:uid(), name:file.name, type:file.type, size:file.size, dataUrl:reader.result, uploadedBy:me.id, uploadedAt:Date.now() });
        p.updatedAt = Date.now();
        logActivity('dosya_eklendi', { projectId:p.id, fileName:file.name });
        remaining--;
        if(remaining===0){ markDirty('projects'); scheduleSave(); close(); openProjectDetail(id); }
      };
      reader.readAsDataURL(file);
    });
  });
  root.querySelectorAll('[data-preview]').forEach(el=> el.addEventListener('click', ()=>{
    const f = p.files.find(x=>x.id===el.dataset.preview);
    if(f) window.open(f.dataUrl, '_blank');
  }));
  root.querySelectorAll('[data-cover-file]').forEach(b=> b.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    p.coverFileId = (p.coverFileId===b.dataset.coverFile) ? null : b.dataset.coverFile;
    p.updatedAt = Date.now();
    markDirty('projects'); scheduleSave(); close(); openProjectDetail(id);
  }));
  root.querySelectorAll('[data-del-file]').forEach(b=> b.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    const f = p.files.find(x=>x.id===b.dataset.delFile);
    p.files = p.files.filter(f=>f.id!==b.dataset.delFile);
    if(p.coverFileId===b.dataset.delFile) p.coverFileId = null;
    p.updatedAt = Date.now();
    if(f) logActivity('dosya_silindi', { projectId:p.id, fileName:f.name });
    markDirty('projects'); scheduleSave(); close(); openProjectDetail(id);
  }));
}

function renderCalendarGrid(myApts, me){
  const grid = document.getElementById('cal-grid');
  const dows = ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'];
  let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first = new Date(calYear, calMonth, 1);
  let startOffset = (first.getDay()+6)%7; // Pazartesi başlangıçlı
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const prevMonthDays = new Date(calYear, calMonth, 0).getDate();
  for(let i=startOffset;i>0;i--) html += `<div class="cal-day other"><span class="num">${prevMonthDays-i+1}</span></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayApts = myApts.filter(a=>a.date===dateStr && a.status==='accepted');
    const titleAttr = dayApts.map(a=>`${aptTimeRangeShort(a)} ${a.title}`).join(', ');
    html += `<div class="cal-day ${dateStr===todayStr?'today':''}" data-date="${dateStr}" title="${esc(titleAttr)}">
      <span class="num">${d}</span>
      <span class="dots">${dayApts.slice(0,4).map(a=>`<span class="apt-dot ${a.urgency==='urgent'?'urgent':''}"></span>`).join('')}</span>
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-day[data-date]').forEach(d=> d.onclick = ()=> openDayPanel(d.dataset.date));
}

/* ---------- NOTLAR (gerçek yapışkan not tarzı) ---------- */
function rotFor(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))%100; return (h/100*8-4).toFixed(1)+'deg'; }

function renderNotes(area, me){
  let list = DB.notes.filter(n=>canSee(n, me.id));
  if(searchTerm) list = list.filter(n=>n.text.toLowerCase().includes(searchTerm.toLowerCase()));
  list = list.slice().sort((a,b)=>a.createdAt-b.createdAt);
  if(!list.length){ area.innerHTML = emptyState('📝','Henüz not yok','Hızlı hatırlatmalar ve yapılacaklar için not bırak.'); return; }
  area.innerHTML = `<div class="notes-canvas" id="notes-canvas">${list.map((n,i)=>{
    const urg = n.urgency || 'normal';
    const x = (n.x!=null) ? n.x : 16 + (i%8)*94;
    const y = (n.y!=null) ? n.y : 16 + Math.floor(i/8)*94;
    const canEdit = n.ownerId===me.id || isAdmin();
    return `<div class="paper-note pn-${urg}" style="left:${x}px;top:${y}px;--rot:${rotFor(n.id)}" data-id="${n.id}">
      <div class="pn-collapsed-icon">${esc(n.text.slice(0,5))}</div>
      <div class="pn-full">
        <div class="pn-head">
          ${canEdit ? `<button class="pn-close" data-del="${n.id}">✕</button>` : '<span></span>'}
        </div>
        <textarea class="pn-text" data-note-text="${n.id}" ${canEdit?'':'readonly'} placeholder="Yaz…">${esc(n.text)}</textarea>
        <div class="pn-foot">
          <span>${esc(userById(n.ownerId)?.name||'—')} · ${n.editedAt ? 'Düzenlendi '+new Date(n.editedAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}) : timeAgo(n.createdAt)}</span>
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;

  const canvas = document.getElementById('notes-canvas');
  area.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    if(confirm('Bu notu silmek istiyor musun?')){ const n=DB.notes.find(x=>x.id===b.dataset.del); if(n){ n.deleted=true; n.updatedAt=Date.now(); logActivity('not_silindi', { noteId:n.id }); markDirty('notes'); } scheduleSave(); renderAll(); }
  }));

  // notun içine direkt yazılabiliyor — yapışkan not mantığı, ayrı bir panel açılmıyor
  area.querySelectorAll('[data-note-text]').forEach(ta=>{
    const n = DB.notes.find(x=>x.id===ta.dataset.noteText);
    if(!n) return;
    const origText = n.text;
    let saveTimer = null;
    ta.addEventListener('pointerdown', e=> e.stopPropagation());
    ta.addEventListener('click', e=> e.stopPropagation());
    ta.addEventListener('input', ()=>{
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=>{
        n.text = ta.value;
        n.updatedAt = Date.now();
        markDirty('notes'); scheduleSave();
      }, 500);
    });
    ta.addEventListener('blur', ()=>{
      if(n.text !== origText){
        n.history = n.history || [];
        n.history.push({ text: origText, at: n.editedAt || n.createdAt });
        n.editedAt = Date.now();
        n.updatedAt = Date.now();
        logActivity('not_duzenlendi', { noteId:n.id });
        markDirty('notes'); scheduleSave();
        const foot = ta.closest('.pn-full').querySelector('.pn-foot span');
        if(foot) foot.textContent = `${userById(n.ownerId)?.name||'—'} · Düzenlendi ${new Date(n.editedAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}`;
      }
      ta.closest('.paper-note').classList.remove('expanded');
    });
  });

  // sürükleme: küçük bir sürükleme mesafesine kadar "tıklama" sayılır ve not doğrudan
  // düzenlenebilir hale açılır (yazı alanına odaklanır), daha fazla hareket edilirse
  // not tuval üzerinde serbestçe taşınır (konum DB'ye kaydedilir)
  area.querySelectorAll('.paper-note').forEach(card=>{
    let startX=0, startY=0, origLeft=0, origTop=0, moved=false, pointerId=null;
    card.addEventListener('pointerdown', e=>{
      if(e.target.closest('[data-del],textarea')) return;
      pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      origLeft = parseFloat(card.style.left)||0; origTop = parseFloat(card.style.top)||0;
      moved = false;
      card.classList.add('expanded');
      try{ card.setPointerCapture(pointerId); }catch(err){}
    });
    card.addEventListener('pointermove', e=>{
      if(pointerId===null || e.pointerId!==pointerId) return;
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(Math.abs(dx)>4 || Math.abs(dy)>4){
        moved = true;
        card.classList.add('dragging');
        const canvasRect = canvas.getBoundingClientRect();
        let newLeft = origLeft+dx, newTop = origTop+dy;
        newLeft = Math.max(0, Math.min(newLeft, canvasRect.width-80));
        newTop = Math.max(0, Math.min(newTop, canvasRect.height-80));
        card.style.left = newLeft+'px'; card.style.top = newTop+'px';
      }
    });
    card.addEventListener('pointerup', e=>{
      if(pointerId===null || e.pointerId!==pointerId) return;
      card.classList.remove('dragging');
      try{ card.releasePointerCapture(pointerId); }catch(err){}
      pointerId = null;
      if(moved){
        const n = DB.notes.find(x=>x.id===card.dataset.id);
        if(n){ n.x = parseFloat(card.style.left); n.y = parseFloat(card.style.top); n.updatedAt = Date.now(); markDirty('notes'); scheduleSave(); }
        setTimeout(()=> card.classList.remove('expanded'), 150);
      } else {
        const ta = card.querySelector('textarea');
        if(ta) setTimeout(()=> ta.focus(), 50);
      }
    });
    card.addEventListener('click', e=>{ if(e.target.closest('textarea')) e.stopPropagation(); });
  });
}

/* ============ polling: paylaşımlı veriyi periyodik çek ============ */
let pollTimer = null;
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(refreshFromRemote, 20000); // 20 sn'de bir arka planda senkron
}

/* ============ başlangıç ============ */
async function init(){
  loadAppearance();
  setFaviconBadge(0);
  if(ghConfig){
    // önce (varsa) en son bilinen veriyle anında göster — boş ekranda bekletme.
    // GitHub'daki gerçek güncel veri arka planda çekilip geldiğinde ekran güncellenir.
    const hadCache = loadLocalCache();
    if(hadCache){
      setSyncStatus('Son bilinen veri — güncelleniyor…','busy');
      await ensureIdentity();
      renderAll();
      checkNotifications();
    }
    await loadFromGithub();
    if(!(await ensureIdentity())){ /* kimlik modali açıldı, kullanıcı dolduracak */ }
    renderAll();
    checkNotifications();
    startPolling();
  } else {
    document.getElementById('sync-status').style.opacity='.6';
    openGithubModal();
  }
}
init();

})();
</script>
