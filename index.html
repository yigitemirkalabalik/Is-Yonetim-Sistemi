<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akış — Ekip Yönetimi</title>
<link rel="icon" id="favicon-link" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Lora:wght@400;500;600&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161b;
    --surface:#1c1f26;
    --surface-2:#20232c;
    --surface-3:#262a34;
    --border:#2a2e39;
    --border-soft:#23262f;
    --text:#eceef1;
    --text-dim:#8d93a3;
    --text-faint:#565c6c;
    --accent:#e8a33d;
    --accent-dim:rgba(232,163,61,.14);
    --accent-contrast:#1a1305;
    --danger:#e5595e;
    --danger-dim:rgba(229,89,94,.14);
    --success:#4cb782;
    --success-dim:rgba(76,183,130,.14);
    --warn:#e8a33d;
    --info:#5a9bd8;
    --info-dim:rgba(90,155,216,.14);
    --important:#e0883c;
    --important-dim:rgba(224,136,60,.16);
    --radius:12px;
    --radius-lg:18px;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --font-body:'Inter',system-ui,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
    --ease-spring:cubic-bezier(.22,1.28,.4,1);
    --dur-fast:150ms;
    --dur-base:240ms;
    --shadow-sm:0 2px 8px rgba(0,0,0,.18);
    --shadow-md:0 10px 30px rgba(0,0,0,.24);
    --shadow-lg:0 24px 60px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box;}

  /* ---------- appearance: background themes ---------- */
  html[data-theme="black"]{ --bg:#000000; --surface:#111111; --surface-2:#171717; --surface-3:#1e1e1e; --border:#282828; --border-soft:#1f1f1f; }
  html[data-theme="midnight"]{ --bg:#0d1220; --surface:#141b2e; --surface-2:#192138; --surface-3:#1f2844; --border:#28324d; --border-soft:#1e2740; }
  html[data-theme="coffee"]{ --bg:#19140f; --surface:#221b14; --surface-2:#2a2118; --surface-3:#32271c; --border:#3c3123; --border-soft:#2e2519; }
  html[data-theme="forest"]{ --bg:#0f1712; --surface:#161f19; --surface-2:#1b271f; --surface-3:#213026; --border:#2b3a30; --border-soft:#212e26; }
  html[data-theme="plum"]{ --bg:#160f1a; --surface:#1e1522; --surface-2:#251a2b; --surface-3:#2c2033; --border:#392a42; --border-soft:#2c2033; }
  html[data-theme="ocean"]{ --bg:#081a1c; --surface:#0f2528; --surface-2:#143036; --surface-3:#193a41; --border:#20464c; --border-soft:#183a3f; }
  html[data-theme="rose"]{ --bg:#1a0f13; --surface:#241419; --surface-2:#2c181f; --surface-3:#341c25; --border:#402531; --border-soft:#331c26; }
  html[data-theme="ink"]{ --bg:#0a0e17; --surface:#111726; --surface-2:#161e30; --surface-3:#1b2438; --border:#232e48; --border-soft:#1b2438; }
  html[data-theme="slate"]{ --bg:#15171a; --surface:#1c1f23; --surface-2:#22262b; --surface-3:#282c32; --border:#33383f; --border-soft:#292d33; }
  html[data-theme="paper"]{ --bg:#f5f5f3; --surface:#ffffff; --surface-2:#ececea; --surface-3:#e2e0db; --border:#d8d6d1; --border-soft:#e4e2dd; --text:#1c1e22; --text-dim:#5b6170; --text-faint:#9a9fa8; }
  html[data-theme="sand"]{ --bg:#efe3cc; --surface:#fbf6ea; --surface-2:#e8daba; --surface-3:#ddc9a0; --border:#d4bd8d; --border-soft:#ddc9a0; --text:#2c2312; --text-dim:#6f5f3f; --text-faint:#a5936a; }
  html[data-theme="sky"]{ --bg:#dceafa; --surface:#f7fbff; --surface-2:#c9def2; --surface-3:#bcd3e9; --border:#a9c6e2; --border-soft:#bcd3e9; --text:#0f1f31; --text-dim:#3d5975; --text-faint:#7093b3; }
  html[data-theme="garden"]{ --bg:#dcefd4; --surface:#f7fdf4; --surface-2:#c9e5bd; --surface-3:#bbdaae; --border:#a6cd97; --border-soft:#bbdaae; --text:#12250f; --text-dim:#3f5c37; --text-faint:#749169; }
  html[data-theme="lilac"]{ --bg:#e7dcf5; --surface:#faf6ff; --surface-2:#d9c7ee; --surface-3:#d0b6e6; --border:#c1a3dd; --border-soft:#d0b6e6; --text:#1f1129; --text-dim:#553f6b; --text-faint:#8873a0; }
  html[data-theme="peach"]{ --bg:#fbdfcb; --surface:#fff8f2; --surface-2:#f6ccae; --surface-3:#eebd98; --border:#e6ac82; --border-soft:#eebd98; --text:#2e1a0d; --text-dim:#71492f; --text-faint:#a67c5c; }

  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 12% -10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%),
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.03) 1px, transparent 0);
    background-size:auto, 22px 22px;
    background-attachment:fixed, fixed;
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim);color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background-color:var(--border);border-radius:20px;border:3px solid var(--bg);background-clip:padding-box;}
  *{scrollbar-width:thin;scrollbar-color:var(--border) transparent;}

  #app{max-width:1680px;margin:0 auto;padding:22px 32px 80px;}
  @media (max-width:720px){ #app{padding:14px 14px 60px;} }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    position:sticky;top:0;z-index:40;
    margin:0 -24px 22px;padding:14px 24px;
    background:color-mix(in srgb, var(--bg) 74%, transparent);backdrop-filter:blur(14px) saturate(150%);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    box-shadow:0 1px 0 var(--border-soft), 0 12px 24px -12px rgba(0,0,0,.2);
  }
  @media (max-width:720px){ .topbar{margin:0 -14px 16px;padding:10px 14px;} }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(155deg, color-mix(in srgb, var(--accent) 88%, white), color-mix(in srgb, var(--accent) 60%, black));
    color:var(--accent-contrast);font-family:var(--font-display);font-weight:700;font-size:15px;
    box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em;}
  .panel-switch{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;}
  .panel-switch button{
    border:none;background:transparent;color:var(--text-dim);padding:7px 14px;border-radius:7px;
    font-size:13.5px;font-weight:600;transition:all var(--dur-fast) var(--ease);
  }
  .panel-switch button.active{background:var(--accent);color:var(--accent-contrast);}
  .topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .icon-btn{
    width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
    color:var(--text-dim);display:flex;align-items:center;justify-content:center;position:relative;
    transition:color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-spring);
  }
  .icon-btn:hover{color:var(--text);border-color:var(--text-faint);}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--bg);display:none;}
  .icon-btn .dot.show{display:block;}
  .identity-chip{
    display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:20px;
    background:var(--surface);border:1px solid var(--border);
  }
  .avatar{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;font-family:var(--font-display);color:#111;flex-shrink:0;
  }
  .identity-chip .who{display:flex;flex-direction:column;line-height:1.15;}
  .identity-chip .who b{font-size:12.5px;font-weight:600;}
  .identity-chip .who span{font-size:10.5px;color:var(--text-dim);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:13.5px;font-weight:600;
    transition:border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-spring), filter var(--dur-fast) var(--ease);
  }
  .btn:hover{border-color:var(--text-faint);}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-danger{background:var(--danger-dim);border-color:transparent;color:var(--danger);}
  .btn-success{background:var(--success-dim);border-color:transparent;color:var(--success);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);background:var(--surface);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---------- sub tabs ---------- */
  .subtabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--border-soft);overflow-x:auto;}
  .subtab{
    padding:11px 4px;margin-right:22px;border:none;background:transparent;position:relative;flex-shrink:0;
    color:var(--text-faint);font-size:13.5px;font-weight:600;transition:color var(--dur-fast) var(--ease);
    display:flex;align-items:center;gap:7px;
  }
  .subtab svg{opacity:.8;flex-shrink:0;}
  .subtab:hover{color:var(--text-dim);}
  .subtab.active{color:var(--accent);}
  .subtab.active svg{opacity:1;}
  .subtab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0;}
  .subtab .count{font-family:var(--font-mono);font-size:10.5px;opacity:.7;background:var(--surface-3);padding:1px 6px;border-radius:9px;}
  .subtab.active .count{background:var(--accent-dim);opacity:1;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .search-input{
    flex:1;min-width:180px;padding:9px 13px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:13.5px;
  }
  .search-input::placeholder{color:var(--text-faint);}

  /* ---------- cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
  @keyframes cardIn{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;
    transition:transform var(--dur-fast) var(--ease-spring), border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
    cursor:pointer;position:relative;overflow:hidden;animation:cardIn .38s var(--ease) both;
  }
  .card:hover{border-color:color-mix(in srgb, var(--accent) 35%, var(--border));transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .card.urg-important::before, .card.urg-urgent::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;pointer-events:none;z-index:2;
  }
  .card.urg-important::before{background:var(--important);}
  .card.urg-urgent::before{background:var(--danger);}
  .card.has-cover{padding:0;}
  .card-cover{margin:0;height:96px;position:relative;background:var(--surface-3) center/cover no-repeat;}
  .card-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,22,27,0) 45%, rgba(20,22,27,.65) 100%);}
  .card-cover-body{padding:16px;}
  /* sürükle-bırak: kart havada sürüklenirken diğerleri kenara kayarak yer açar (FLIP animasyonu) */
  .card-placeholder{border:1.5px dashed color-mix(in srgb, var(--accent) 50%, var(--border));border-radius:var(--radius-lg);background:var(--accent-dim);animation:none;}
  .card.dragging-float{position:fixed;z-index:200;margin:0;pointer-events:none;box-shadow:var(--shadow-lg);animation:none;}
  .card.dragging-card{opacity:.4;}
  .card.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim);}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .card-title{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.3;}
  .card-desc{color:var(--text-dim);font-size:13px;line-height:1.5;margin:6px 0 10px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-faint);}
  .badge{
    display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
    font-family:var(--font-mono);letter-spacing:.02em;
  }
  .badge-normal{background:var(--surface-3);color:var(--text-dim);}
  .badge-important{background:var(--important-dim);color:var(--important);}
  .badge-urgent{background:var(--danger-dim);color:var(--danger);}
  .badge-success{background:var(--success-dim);color:var(--success);}
  .badge-pending{background:var(--accent-dim);color:var(--accent);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty-state h3{font-family:var(--font-display);color:var(--text);margin:10px 0 6px;}
  .empty-state p{font-size:13.5px;max-width:360px;margin:0 auto;}

  /* ---------- team panel ---------- */
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .team-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;}
  .team-card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border-soft);}
  .team-card-head .avatar{width:38px;height:38px;font-size:14px;}
  .team-card-head b{font-family:var(--font-display);font-size:14.5px;display:block;}
  .team-card-head span{font-size:12px;color:var(--text-dim);}
  .team-item{padding:8px 6px;border-bottom:1px solid var(--border-soft);border-radius:6px;cursor:pointer;transition:filter var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);margin:0 -6px;background:var(--surface-3);}
  .team-item:hover{filter:brightness(.9);}
  .team-item.urg-important{background:var(--important);color:#fff;}
  .team-item.urg-important .team-item-sub{color:rgba(255,255,255,.75);}
  .team-item.urg-important:hover{filter:brightness(.82);background:var(--important);}
  .team-item.urg-urgent{background:var(--danger);color:#fff;}
  .team-item.urg-urgent .team-item-sub{color:rgba(255,255,255,.75);}
  .team-item.urg-urgent:hover{filter:brightness(.82);background:var(--danger);}
  .team-item.urg-important .badge, .team-item.urg-urgent .badge{background:rgba(255,255,255,.25);color:#fff;}
  .team-item:last-child{border-bottom:none;}
  .team-item-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;justify-content:space-between;}
  .team-item-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .team-empty{font-size:12.5px;color:var(--text-faint);padding:6px 0;}

  /* ---------- calendar (minimal) ---------- */
  .apt-layout{display:grid;grid-template-columns:minmax(240px,300px) 1px 1fr;gap:18px;align-items:start;}
  .apt-divider{align-self:stretch;width:1px;background:var(--border-soft);opacity:.7;}
  @media (max-width:800px){ .apt-layout{grid-template-columns:1fr;} .apt-divider{display:none;} }
  .cal-hr{height:1px;background:var(--border-soft);opacity:.7;margin:2px 0 10px;}
  .cal-card{padding:14px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head b{font-family:var(--font-display);font-size:13.5px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow{font-size:9.5px;color:var(--text-faint);text-align:center;padding:2px 0 4px;font-weight:600;}
  .cal-day{
    min-height:34px;border:1px solid transparent;border-radius:6px;background:transparent;
    font-size:11px;color:var(--text-dim);position:relative;transition:all var(--dur-fast) var(--ease);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding-top:5px;cursor:pointer;
  }
  .cal-day:hover{background:var(--surface-2);border-color:var(--border);}
  .cal-day.other{opacity:.28;}
  .cal-day.today .num{color:var(--accent-contrast);background:var(--accent);border-radius:50%;}
  .cal-day .num{font-weight:600;color:var(--text);width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;}
  .cal-day .dots{display:flex;gap:2px;}
  .cal-day .apt-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .cal-day .apt-dot.urgent{background:var(--danger);}
  .cal-legend{display:flex;gap:14px;margin-top:10px;font-size:10.5px;color:var(--text-faint);}
  .cal-legend span{display:flex;align-items:center;gap:5px;}
  .cal-legend .apt-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .cal-legend .apt-dot.urgent{background:var(--danger);}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(8,9,12,.6);backdrop-filter:blur(3px);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
    animation:fadeIn var(--dur-base) var(--ease);
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--surface);border:1px solid var(--border);border-top:3px solid transparent;border-radius:var(--radius-lg);
    width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    animation:slideUp var(--dur-base) var(--ease);
  }
  .modal.modal-wide{max-width:720px;}
  .modal.workspace-modal{max-width:97vw;width:1420px;height:88vh;max-height:88vh;display:flex;flex-direction:column;padding:0;}
  .ws-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-soft);border-radius:var(--radius-lg) var(--radius-lg) 0 0;flex-shrink:0;}
  .ws-title-input{flex:1;border:none;background:transparent;color:var(--text);font-family:var(--font-display);font-size:18px;font-weight:600;padding:4px 0;}
  .ws-title-input:focus{outline:none;}
  .ws-title-input[readonly]{cursor:default;}
  .ws-top-actions{display:flex;gap:6px;flex-shrink:0;}
  .ws-body{flex:1;display:grid;grid-template-columns:200px 1fr 280px;overflow:hidden;min-height:0;}
  .ws-col{overflow-y:auto;padding:16px;}
  .ws-col-list{border-right:1px solid var(--border-soft);display:flex;flex-direction:column;gap:2px;background:var(--surface-2);}
  .ws-col-side{border-left:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;min-height:0;}
  .side-box{padding:16px;}
  .side-box-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;margin-bottom:10px;}
  .side-box-log{flex:1;overflow-y:auto;border-top:1px solid var(--border-soft);min-height:120px;}
  .log-row{font-size:12px;padding:8px 0;border-bottom:1px solid var(--border-soft);color:var(--text-dim);line-height:1.5;}
  .log-row:last-child{border-bottom:none;}
  .log-row .small-note{display:block;margin-top:2px;}
  .ws-list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--text-dim);cursor:pointer;transition:background var(--dur-fast) var(--ease);}
  .ws-list-item .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .ws-list-item:hover{background:var(--surface-3);}
  .ws-list-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600;}
  .ws-textarea{width:100%;height:100%;min-height:100%;border:none;background:transparent;color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.6;resize:none;}

  .ws-foot{padding:8px 18px;font-size:10.5px;color:var(--text-faint);border-top:1px solid var(--border-soft);flex-shrink:0;}
  @media (max-width:860px){ .ws-body{grid-template-columns:1fr;} .ws-col-list,.ws-col-side{border:none;border-top:1px solid var(--border-soft);} .modal.workspace-modal{height:92vh;} }
  .modal-body.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:20px;}
  .modal-body.two-col .col-left,.modal-body.two-col .col-right{display:flex;flex-direction:column;gap:14px;}
  @media (max-width:640px){ .modal-body.two-col{grid-template-columns:1fr;} }
  .file-drop-big{
    flex:1;min-height:120px;border:1.5px dashed var(--border);border-radius:var(--radius);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--text-faint);cursor:pointer;transition:all var(--dur-fast) var(--ease);text-align:center;padding:16px;
  }
  .file-drop-big:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .file-drop-big span{font-size:12px;}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{font-family:var(--font-display);margin:0;font-size:16.5px;}
  .modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:8px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
  .field input[type=text],.field input[type=date],.field input[type=time],.field textarea,.field select{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);font-size:13.5px;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .urgency-dots{display:flex;align-items:center;gap:12px;}
  .urgency-dot-opt{display:flex;cursor:pointer;padding:3px;}
  .urgency-dot-opt .dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent;transition:all var(--dur-fast) var(--ease);display:block;}
  .urgency-dot-opt[data-v="normal"] .dot{background:var(--text-faint);}
  .urgency-dot-opt[data-v="important"] .dot{background:var(--important);}
  .urgency-dot-opt[data-v="urgent"] .dot{background:var(--danger);}
  .urgency-dot-opt:hover .dot{transform:scale(1.2);}
  .urgency-dot-opt.active .dot{border-color:var(--text);box-shadow:0 0 0 2px var(--bg), 0 0 0 3px currentColor;transform:scale(1.12);}
  .people-pick{display:flex;flex-wrap:wrap;gap:6px;}
  .people-pick .chip{
    padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;
    font-size:12.5px;font-weight:600;color:var(--text-dim);display:flex;align-items:center;gap:6px;
    transition:all var(--dur-fast) var(--ease);
  }
  .people-pick .chip:hover{border-color:var(--text-faint);color:var(--text);transform:translateY(-1px);}
  .people-pick .chip.active{background:var(--accent-dim);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent);}
  .people-pick .chip.active:hover{color:var(--accent);}

  /* ---------- appearance: theme / font / color pickers ---------- */
  .theme-row{display:flex;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .theme-swatch{
    width:38px;height:38px;border-radius:11px;cursor:pointer;border:2px solid var(--border);
    padding:0;transition:border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .theme-swatch:hover{transform:scale(1.09);}
  .theme-swatch.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .option-row{display:flex;gap:8px;flex-wrap:wrap;}
  .option-chip{
    padding:8px 14px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-dim);font-size:12.5px;cursor:pointer;font-weight:600;
    transition:border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .option-chip:hover{border-color:var(--text-faint);color:var(--text);transform:translateY(-1px);}
  .option-chip.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .option-chip.selected:hover{color:var(--accent);}
  .color-row{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
  .color-swatch{
    width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;
    transition:transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .color-swatch:hover{transform:scale(1.12);}
  .color-swatch.selected{border-color:var(--text);transform:scale(1.16);box-shadow:0 0 0 3px rgba(255,255,255,.08);}
  .color-swatch.disabled{opacity:.2;cursor:not-allowed;filter:grayscale(.4);}
  .color-swatch.disabled:hover{transform:none;}
  .color-swatch-custom{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;border-color:var(--border);}
  .color-swatch-custom::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;}
  .color-swatch-custom.selected::after{content:"";}
  .color-swatch-custom input[type=color]{position:absolute;inset:0;width:100%;height:100%;border:none;padding:0;margin:0;opacity:0;cursor:pointer;}
  .field-label{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);display:block;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  .field-label:first-child{margin-top:0;}
  code{font-family:var(--font-mono);background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:11px;}
  .field-hint{font-size:11.5px;color:var(--text-faint);margin:6px 0 0;line-height:1.5;}
  .approver-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
  .approver-row:last-child{border-bottom:none;}
  .approver-note{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

  /* ---------- proje dosyaları ---------- */
  .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
  .file-chip{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:6px;text-align:center;transition:border-color var(--dur-fast) var(--ease);}
  .file-chip:hover{border-color:var(--text-faint);}
  .file-chip img{width:100%;height:52px;object-fit:cover;border-radius:6px;margin-bottom:4px;}
  .file-icon{width:100%;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface-3);border-radius:6px;margin-bottom:4px;}
  .file-name{font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-dl{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:5px;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;text-decoration:none;}
  .file-del{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:5px;background:rgba(0,0,0,.45);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;}
  .file-cover-btn{position:absolute;bottom:22px;right:4px;width:18px;height:18px;border-radius:5px;background:rgba(0,0,0,.45);color:rgba(255,255,255,.6);border:none;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:all var(--dur-fast) var(--ease-spring);}
  .file-cover-btn:hover{color:#fff;transform:scale(1.15);}
  .file-cover-btn.active{color:var(--accent);background:rgba(0,0,0,.6);}
  .file-add{display:flex;align-items:center;justify-content:center;text-align:center;height:66px;border:1.5px dashed var(--border);border-radius:9px;font-size:10.5px;line-height:1.3;color:var(--text-faint);cursor:pointer;transition:all var(--dur-fast) var(--ease);padding:4px;overflow:hidden;word-break:break-word;}
  .file-add:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- sticky notifications ---------- */
  .sticky-stack{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:340px;width:calc(100vw - 40px);}
  .sticky-note{
    background:var(--surface);border:1px solid var(--danger);border-left:4px solid var(--danger);border-radius:12px;
    padding:14px 16px;box-shadow:var(--shadow-lg);animation:popIn .3s var(--ease);
  }
  @keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .sticky-note .head{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .sticky-note p{margin:0 0 10px;font-size:13.5px;line-height:1.45;}
  .sticky-note .row{display:flex;gap:6px;flex-wrap:wrap;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-3);
    border:1px solid var(--border);padding:10px 18px;border-radius:20px;font-size:13px;z-index:300;
    box-shadow:var(--shadow-md);animation:popIn .25s var(--ease);
  }

  /* ---------- gerçek yapışkan not tarzı Notlar sekmesi (serbest tuvale) ---------- */
  .notes-canvas{position:relative;min-height:520px;border:1px dashed var(--border-soft);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;}
  /* not rengi artık serbest seçim değil, önem düzeyine bağlı — solgun/kısık tonlar + beyaz metin */
  .paper-note{
    --rot:0deg;
    position:absolute;width:76px;height:76px;border-radius:8px;
    display:flex;flex-direction:column;overflow:hidden;color:#fff;cursor:grab;
    box-shadow:0 6px 14px rgba(0,0,0,.22);
    transform:rotate(var(--rot));z-index:1;
    transition:width var(--dur-base) var(--ease), height var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), border-radius var(--dur-base) var(--ease);
  }
  .paper-note.pn-normal{background:#5b6270;}
  .paper-note.pn-important{background:#a3652c;}
  .paper-note.pn-urgent{background:#a1403f;}
  .paper-note:hover, .paper-note.expanded{
    width:196px;height:180px;border-radius:3px 3px 12px 12px;z-index:30;
    box-shadow:0 18px 34px rgba(0,0,0,.36);
    transition:width var(--dur-base) var(--ease), height var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), border-radius var(--dur-base) var(--ease), transform var(--dur-base) var(--ease);
    transform:rotate(0deg);
  }
  .paper-note.dragging{cursor:grabbing;transition:none;box-shadow:0 26px 50px rgba(0,0,0,.4);z-index:40;}
  .paper-note .pn-collapsed-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden;
    font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1;color:rgba(255,255,255,.65);text-align:center;
    text-transform:uppercase;white-space:nowrap;transition:opacity var(--dur-fast) var(--ease);}
  .paper-note:hover .pn-collapsed-icon, .paper-note.expanded .pn-collapsed-icon{opacity:0;pointer-events:none;}
  .paper-note .pn-full{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity var(--dur-fast) var(--ease);pointer-events:none;}
  .paper-note:hover .pn-full, .paper-note.expanded .pn-full{opacity:1;pointer-events:auto;}
  .pn-head{display:flex;align-items:center;justify-content:flex-end;padding:8px 8px 4px;}
  .pn-close{width:20px;height:20px;border-radius:5px;border:none;background:transparent;color:rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all var(--dur-fast) var(--ease);}
  .pn-close:hover{background:rgba(255,255,255,.15);color:#fff;}
  .pn-text{flex:1;padding:2px 12px 8px;font-family:var(--font-mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#fff;
    border:none;background:transparent;resize:none;outline:none;width:100%;}
  .pn-text::placeholder{color:rgba(255,255,255,.4);}
  .pn-foot{display:flex;align-items:center;justify-content:space-between;padding:0 12px 10px;font-size:10px;opacity:.75;font-family:var(--font-mono);gap:6px;color:#fff;}

  .gate{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate-box{max-width:420px;width:100%;text-align:center;}
  .gate-box .brand-mark{width:52px;height:52px;font-size:22px;margin:0 auto 18px;}
  .gate-box h2{font-family:var(--font-display);font-size:22px;margin:0 0 6px;}
  .gate-box p{color:var(--text-dim);font-size:13.5px;margin:0 0 24px;line-height:1.5;}
  .gate-box .field{text-align:left;margin-bottom:12px;}

  .empty-icon{font-size:34px;opacity:.5;}
  .small-note{font-size:12px;color:var(--text-faint);line-height:1.5;}
  .sync-status{font-size:11px;color:var(--text-faint);display:flex;align-items:center;gap:5px;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
  .sync-dot.ok{background:var(--success);}
  .sync-dot.busy{background:var(--accent);animation:pulse 1s infinite;}
  .sync-dot.err{background:var(--danger);}
  @keyframes pulse{50%{opacity:.3}}
  .admin-tag{font-size:9.5px;background:var(--accent-dim);color:var(--accent);padding:1px 6px;border-radius:6px;font-weight:700;margin-left:5px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <h1>Akış</h1>

    <div class="panel-switch" id="panel-switch">
      <button data-panel="me" class="active">Benim Panelim</button>
      <button data-panel="team">Ekip Paneli</button>

    <div class="topbar-right">
      <span class="sync-status" id="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Bağlı değil</span></span>
      <button class="icon-btn" id="notif-btn" title="Seni ilgilendirenler">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

<script>
(function(){
"use strict";

/* ============ yardımcılar ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ const dt=new Date(d); return dt.toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'}); }
function fmtDateTime(d){ const dt=new Date(d); return dt.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' · '+dt.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function addMinutesToTime(hhmm, mins){
  const [h,m] = (hhmm||'09:00').split(':').map(Number);
  const total = ((h*60+m+mins)%1440+1440)%1440;
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function aptTimeRangeShort(a){ return `${a.time||'09:00'}–${addMinutesToTime(a.time, a.durationMin||30)}`; }
function aptTimeRangeFull(a){
  const dt = new Date(a.date+'T'+(a.time||'09:00'));
  return dt.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' · '+aptTimeRangeShort(a);
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'az önce';
  if(s<3600) return Math.floor(s/60)+' dk önce';
  if(s<86400) return Math.floor(s/3600)+' sa önce';
  return Math.floor(s/86400)+' gün önce';
}
function avatarColor(name){
  let h=0; for(const c of (name||'?')) h = (h*31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 62% 58%)`;
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function showToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function urgencyLabel(u){ return u==='urgent'?'Acil':u==='important'?'Önemli':'Normal'; }
function urgencyBadge(u){ return `<span class="badge badge-${u}">${urgencyLabel(u)}</span>`; }

/* ============ görünüm ayarları (cihaza özel, senkron olmaz) ============ */
const PALETTE = [
  {id:'red',hex:'#ef4444'},{id:'orange',hex:'#f97316'},{id:'amber',hex:'#f59e0b'},{id:'yellow',hex:'#eab308'},
  {id:'lime',hex:'#84cc16'},{id:'green',hex:'#22c55e'},{id:'emerald',hex:'#10b981'},{id:'teal',hex:'#14b8a6'},
  {id:'cyan',hex:'#06b6d4'},{id:'sky',hex:'#0ea5e9'},{id:'blue',hex:'#3b82f6'},{id:'indigo',hex:'#6366f1'},
  {id:'violet',hex:'#8b5cf6'},{id:'purple',hex:'#a855f7'},{id:'pink',hex:'#ec4899'},{id:'rose',hex:'#f43f5e'}
];
const THEME_OPTIONS = [
  {id:'graphite',label:'Grafit',bg:'#14161b',mode:'dark'}, {id:'black',label:'Siyah',bg:'#000000',mode:'dark'},
  {id:'midnight',label:'Gece Mavisi',bg:'#0d1220',mode:'dark'}, {id:'coffee',label:'Kahve',bg:'#19140f',mode:'dark'},
  {id:'forest',label:'Orman',bg:'#0f1712',mode:'dark'}, {id:'plum',label:'Erik',bg:'#160f1a',mode:'dark'},
  {id:'ocean',label:'Okyanus',bg:'#081a1c',mode:'dark'}, {id:'rose',label:'Gül',bg:'#1a0f13',mode:'dark'},
  {id:'ink',label:'Mürekkep',bg:'#0a0e17',mode:'dark'}, {id:'slate',label:'Arduvaz',bg:'#15171a',mode:'dark'},
  {id:'paper',label:'Kağıt',bg:'#f5f5f3',mode:'light'}, {id:'sand',label:'Kum',bg:'#efe3cc',mode:'light'},

const MIN_ACCENT_CONTRAST = 2.3;
const DEFAULT_ACCENT_DARK = '#e8a33d';
const DEFAULT_ACCENT_LIGHT = '#b45309';
const LOCAL_APPEARANCE_KEY = 'akis_appearance';

let appearanceSettings = { theme:'graphite', accent:'#e8a33d', advanced:false };

function relLuminance(hex){
  const h=hex.replace('#',''); let [r,g,b]=[0,2,4].map(i=>parseInt(h.substring(i,i+2),16)/255);
  [r,g,b]=[r,g,b].map(c=> c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4));
  return 0.2126*r+0.7152*g+0.0722*b;
}
function contrastRatio(hexA,hexB){ const l1=relLuminance(hexA), l2=relLuminance(hexB); const hi=Math.max(l1,l2), lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05); }
function getContrastTextColor(hex){
  const h=hex.replace('#',''); const r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  return ((r*299+g*587+b*114)/1000) > 150 ? '#1a1305' : '#ffffff';
}
function hexToRgba(hex,alpha){ const h=hex.replace('#',''); const r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16); return `rgba(${r}, ${g}, ${b}, ${alpha})`; }
function currentThemeBg(){ const t=THEME_OPTIONS.find(x=>x.id===appearanceSettings.theme); return t?t.bg:'#14161b'; }
function currentThemeMode(){ const t=THEME_OPTIONS.find(x=>x.id===appearanceSettings.theme); return t?t.mode:'dark'; }

function persistAppearance(){ localStorage.setItem(LOCAL_APPEARANCE_KEY, JSON.stringify(appearanceSettings)); }
function loadAppearance(){
  try{ const s = JSON.parse(localStorage.getItem(LOCAL_APPEARANCE_KEY)||'null'); if(s) appearanceSettings = {...appearanceSettings, ...s}; }catch(e){}
  if(appearanceSettings.theme!=='graphite') document.documentElement.setAttribute('data-theme', appearanceSettings.theme);
  applyAccentVars(appearanceSettings.accent);
}
function applyAccentVars(hex){
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-dim', hexToRgba(hex,.14));
  document.documentElement.style.setProperty('--accent-contrast', getContrastTextColor(hex));
}
function applyTheme(id){
  appearanceSettings.theme=id;
  if(id==='graphite') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', id);
  const bg = currentThemeBg();
  if(contrastRatio(appearanceSettings.accent,bg) < MIN_ACCENT_CONTRAST){
    const fallback = currentThemeMode()==='light' ? DEFAULT_ACCENT_LIGHT : DEFAULT_ACCENT_DARK;
    applyAccent(fallback);
    const row = document.getElementById('ap-accent-row'); if(row) renderAccentColorRow(row, fallback, bg, applyAccent);
  }
  persistAppearance();
}
function applyAccent(hex){ appearanceSettings.accent=hex; applyAccentVars(hex); persistAppearance(); }

function renderAccentColorRow(rowEl, currentHex, bgHex, onSelect){
  rowEl.innerHTML='';
  const swatchEls=[];
  PALETTE.forEach(c=>{
    const usable = contrastRatio(c.hex,bgHex) >= MIN_ACCENT_CONTRAST;
    const sw=document.createElement('div');
    sw.className='color-swatch'+(c.hex.toLowerCase()===currentHex.toLowerCase()?' selected':'')+(usable?'':' disabled');
    sw.style.background=c.hex; sw.title = usable ? c.id : `${c.id} — bu temada yeterince görünür değil`;
    if(usable) sw.addEventListener('click', ()=>{ onSelect(c.hex); renderAccentColorRow(rowEl, c.hex, bgHex, onSelect); });
    rowEl.appendChild(sw); swatchEls.push(sw);
  });
  const isCustom = !PALETTE.some(c=>c.hex.toLowerCase()===currentHex.toLowerCase());
  const customSwatch=document.createElement('label');
  customSwatch.className='color-swatch color-swatch-custom'+(isCustom?' selected':'');
  customSwatch.title='Özel renk seç';
  customSwatch.style.background = isCustom ? currentHex : 'conic-gradient(from 0deg, #e5595e, #e8a33d, #e6d24a, #4cb782, #4fa8e0, #9b7fe0, #e0648a, #e5595e)';
  const colorInput=document.createElement('input'); colorInput.type='color'; colorInput.value = /^#[0-9a-fA-F]{6}$/.test(currentHex)?currentHex:'#e8a33d';
  colorInput.addEventListener('input', ()=>{ customSwatch.style.background=colorInput.value; customSwatch.classList.add('selected'); swatchEls.forEach(s=>s.classList.remove('selected')); });
  colorInput.addEventListener('change', ()=>{
    const chosen=colorInput.value;
    if(contrastRatio(chosen,bgHex) < MIN_ACCENT_CONTRAST){ showToast('Bu renk bu temada yeterince görünür değil, farklı bir renk seç'); renderAccentColorRow(rowEl,currentHex,bgHex,onSelect); return; }
    onSelect(chosen); renderAccentColorRow(rowEl, chosen, bgHex, onSelect);
  });
  customSwatch.appendChild(colorInput); rowEl.appendChild(customSwatch);
}

/* ============ paylaşılan veri (GitHub üzerinden, her nesne kendi dosyasında) ============ */
let DB = { users:[], projects:[], appointments:[], approvals:[], notes:[], activityLog:[] };
let shaMap = {};        // "klasör/dosya.json" -> sha (üzerine yazarken gerekli)
let ghConfig = getGhConfig();
let currentUserId = getLocalIdentity();
let syncTimer = null;
// hangi koleksiyonlarda kaydedilmemiş değişiklik var — sadece bunlar GitHub'a yazılır.
// Böylece bir not düzenlemek projelere ya da başkasının dosyasına asla dokunmaz.
let dirty = { users:false, projects:false, notes:false, appointments:false, approvals:false };
function markDirty(coll){ dirty[coll] = true; }

function currentUser(){ return DB.users.find(u=>u.id===currentUserId && !u.deleted) || null; }
function userById(id){ return DB.users.find(u=>u.id===id) || null; }
function activeUsers(){ return DB.users.filter(u=>!u.deleted); }
function isAdmin(){ const u=currentUser(); return !!(u && u.isAdmin); }

/* ---- GitHub: her kullanıcı/proje/not/randevu/onay kendi dosyasında saklanır
   (users/{id}.json, projects/{id}.json, vb.). Tek ve dev bir veri dosyası yerine
   bu yapı, birinin notunu düzenlerken diğerinin proje eklemesi gibi ilgisiz
   işlemlerin birbirini ezmesini imkânsız hale getirir — çakışma riski sadece
   TAM AYNI nesneye aynı anda dokunulmasıyla sınırlı kalır (ki bu da aşağıdaki
   nesne-bazlı birleştirme ile güvenle ele alınır). ---- */
const FOLDERS = { users:'users', projects:'projects', notes:'notes', appointments:'appointments', approvals:'approvals' };
const ACTIVITY_PATH = 'activity.json';

async function ghApi(pathSuffix, opts={}){
  const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/${pathSuffix}`;
  return fetch(url, {
    ...opts,
    cache: 'no-store',
    headers:{
      'Authorization': `token ${ghConfig.token}`,
      'Accept':'application/vnd.github+json',
      'If-None-Match': '',
      ...(opts.headers||{})
    }
  });
}
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(str){ return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))); }

function setSyncStatus(text, kind){
  document.getElementById('sync-text').textContent = text;
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (kind ? ' '+kind : '');
}

async function hashPassword(pw){
  if(window.crypto && window.crypto.subtle){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){ /* aşağıdaki yedek karmaya düş */ }
  }
  // crypto.subtle kullanılamıyorsa basit bir yedek karma (gerçek güvenlik sağlamaz, sadece prototip için)
  let h1=0,h2=0;
  for(let i=0;i<pw.length;i++){ const c=pw.charCodeAt(i); h1=(h1*31+c)>>>0; h2=(h2*131+c)>>>0; }
  return 'fb-'+h1.toString(16)+h2.toString(16);
}

async function ghListFolder(folder){
  const res = await ghApi(`contents/${folder}?ref=${ghConfig.branch||'main'}&_ts=${Date.now()}`);
  if(res.status===404) return [];
  if(!res.ok) throw new Error('HTTP '+res.status);
  const json = await res.json();
  return Array.isArray(json) ? json.filter(f=>f.type==='file' && f.name.endsWith('.json')) : [];
}
async function ghReadFile(path){
  const res = await ghApi(`contents/${path}?ref=${ghConfig.branch||'main'}&_ts=${Date.now()}`);
  if(res.status===404) return null;
  if(!res.ok) throw new Error('HTTP '+res.status);
  const json = await res.json();
  return { sha: json.sha, data: JSON.parse(b64decode(json.content)) };
}
async function ghWriteFile(path, dataObj, attempt){
  attempt = attempt || 1;
  const body = {
    message: `akis: ${path} güncellendi`,
    content: b64encode(JSON.stringify(dataObj, null, 1)),
    branch: ghConfig.branch||'main'
  };
  if(shaMap[path]) body.sha = shaMap[path];
  const res = await ghApi(`contents/${path}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if(res.status===409 && attempt < 4){
    // biri bu tam dosyayı bizden hemen önce yazdı — güncel sha'yı alıp yeniden dene
    await new Promise(r=>setTimeout(r, 250*attempt));
    const fresh = await ghReadFile(path);
    if(fresh) shaMap[path] = fresh.sha; else delete shaMap[path];
    return ghWriteFile(path, dataObj, attempt+1);
  }
  if(!res.ok){
    const errJson = await res.json().catch(()=>({}));
    throw new Error(errJson.message || ('HTTP '+res.status));
  }
  const json = await res.json();
  shaMap[path] = json.content.sha;
}

/* id bazlı birleştirme yardımcı fonksiyonu — küçük dizileri (ör. dosya listesi) id'ye göre birleştirir */
function mergeById(remoteArr, localArr, itemMerger){
  const map = new Map();
  (remoteArr||[]).forEach(item=> map.set(item.id, item));
  (localArr||[]).forEach(item=>{
    const existing = map.get(item.id);
    if(!existing){ map.set(item.id, item); return; }
    if(itemMerger){ map.set(item.id, itemMerger(existing, item)); return; }
    const exT = existing.updatedAt || existing.createdAt || 0;
    const itT = item.updatedAt || item.createdAt || 0;
    map.set(item.id, itT >= exT ? item : existing);
  });
  return [...map.values()];
}
// projenin dosyaları kendi içinde id'ye göre birleşir — biri dosya eklerken diğeri
// eski bir kopyayı geri yazsa bile dosyalar kaybolmaz (aynı proje aynı anda düzenlenirse)
function mergeProjectItem(remote, local){
  const files = mergeById(remote.files||[], local.files||[]);
  const exT = remote.updatedAt||remote.createdAt||0, itT = local.updatedAt||local.createdAt||0;
  const base = itT >= exT ? local : remote;
  return { ...base, files };
}
// onaylayanlar listesi kişi bazında birleşir — biri onaylarken diğeri eski kopyayı
// geri yazsa bile verilen onaylar/redler kaybolmaz (aynı onay aynı anda yanıtlanırsa)
function mergeApprovalItem(remote, local){
  const map = new Map();
  (remote.approvers||[]).forEach(a=> map.set(a.userId, a));
  (local.approvers||[]).forEach(a=>{
    const ex = map.get(a.userId);
    if(!ex){ map.set(a.userId, a); return; }
    map.set(a.userId, (a.respondedAt||0) >= (ex.respondedAt||0) ? a : ex);
  });
  const exT = remote.updatedAt||remote.createdAt||0, itT = local.updatedAt||local.createdAt||0;
  const base = itT >= exT ? local : remote;
  return { ...base, approvers:[...map.values()] };
}
const ITEM_MERGERS = { projects: mergeProjectItem, approvals: mergeApprovalItem };

// bir nesneyi yazmadan hemen önce GitHub'daki en güncel halini çekip birleştirir —
// çakışma riski sadece TAM AYNI nesneye aynı anda dokunulduğunda söz konusu olur
async function writeItemMerged(folder, item){
  const path = `${folder}/${item.id}.json`;
  let toWrite = item;
  try{
    const remote = await ghReadFile(path);
    if(remote){
      shaMap[path] = remote.sha;
      const merger = ITEM_MERGERS[folder];
      toWrite = merger ? merger(remote.data, item) : ((remote.data.updatedAt||remote.data.createdAt||0) > (item.updatedAt||item.createdAt||0) ? remote.data : item);
    }
  }catch(e){ /* çekemezsek elimizdeki sürümle devam ederiz */ }
  await ghWriteFile(path, toWrite);
  return toWrite;
}

// aynı kullanıcı adına sahip birden fazla hesap oluşursa (nadir bir senkron yarışı
// sonucunda) hangisinin "gerçek" olduğuna karar verip diğerlerini işaretler —
// admin varsa admin öncelikli, yoksa en eski hesap kalır
function dedupeUsersByUsername(){
  const groups = new Map();
  DB.users.forEach(u=>{
    if(!u.username || u.deleted) return;
    const key = u.username.toLowerCase();
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(u);
  });
  groups.forEach(list=>{
    if(list.length < 2) return;
    list.sort((a,b)=> (b.isAdmin?1:0)-(a.isAdmin?1:0) || (a.createdAt-b.createdAt));
    list.slice(1).forEach(dup=>{
      if(dup.id===currentUserId) return; // kendi oturum açtığımız hesabı asla otomatik silme
      dup.deleted = true; dup.updatedAt = Date.now();
      markDirty('users');
    });
  });
}

async function ensureSeedAdmin(){
  if(DB.users.some(u=> (u.username||'').toLowerCase()==='admin')) return false;
  const now = Date.now();
  const admin = {
    id: uid(), username:'admin', passwordHash: await hashPassword('admin1234'),
    name:'Admin', title:'Sistem Yöneticisi', isAdmin:true, color: avatarColor('Admin'),
    createdAt:now, updatedAt:now
  };
  DB.users.push(admin);
  await ghWriteFile(`users/${admin.id}.json`, admin);
  return true;
}

// tutmuyoruz ama proje ekranında da bu günlükten filtrelenerek gösteriliyor;
// tamamına sadece admin panelinden erişilebiliyor
function logActivity(action, meta){
  DB.activityLog.push({ id:uid(), at:Date.now(), userId:currentUserId, action, meta: meta||{} });
}

const LOCAL_CACHE_KEY = 'akis_cache_v1';
function persistLocalCache(){
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ DB, shaMap })); }catch(e){ /* kota dolmuş olabilir, sorun değil */ }
}
function loadLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.DB) return false;
    DB = parsed.DB; shaMap = parsed.shaMap || {};
    return true;
  }catch(e){ return false; }
}

async function loadFromGithub(){
  if(!ghConfig) { setSyncStatus('Bağlı değil',''); return; }
  setSyncStatus('Senkronize ediliyor…','busy');
  try{
    const fresh = { users:[], projects:[], notes:[], appointments:[], approvals:[] };
    for(const key of Object.keys(FOLDERS)){
      const entries = await ghListFolder(FOLDERS[key]);
      for(const entry of entries){
        const file = await ghReadFile(entry.path);
        if(file){ fresh[key].push(file.data); shaMap[entry.path] = file.sha; }
      }
    }
    const actFile = await ghReadFile(ACTIVITY_PATH);
    if(actFile) shaMap[ACTIVITY_PATH] = actFile.sha;
    DB = { ...fresh, activityLog: actFile ? actFile.data : [] };

    dedupeUsersByUsername();
    const seeded = await ensureSeedAdmin();
    if(seeded || Object.values(dirty).some(Boolean)) await pushToGithub();
    persistLocalCache();
    setSyncStatus('Bağlı — güncel', 'ok');
  }catch(err){
    console.error(err);
    setSyncStatus('Bağlantı hatası', 'err');
    showToast('GitHub senkron hatası: '+err.message);
  }
}

// yalnızca "kirli" (değişmiş) koleksiyonların dosyalarını yazar — ör. sadece not
// eklediysen sadece notes/ klasörüne yazılır, projelere hiç dokunulmaz
async function pushToGithub(){
  if(!ghConfig) return;
  setSyncStatus('Kaydediliyor…','busy');
  try{
    for(const key of Object.keys(FOLDERS)){
      if(!dirty[key]) continue;
      for(let i=0;i<DB[key].length;i++){
        DB[key][i] = await writeItemMerged(FOLDERS[key], DB[key][i]);
      }
      dirty[key] = false;
    }
    // etkinlik günlüğü küçük ve ekleme-bazlı olduğu için en günceliyle birleştirip yazıyoruz
    try{
      const remoteAct = await ghReadFile(ACTIVITY_PATH);
      if(remoteAct){
        DB.activityLog = mergeById(remoteAct.data, DB.activityLog);
        shaMap[ACTIVITY_PATH] = remoteAct.sha;
      }
    }catch(e){ /* çekilemezse elimizdekiyle devam */ }
    await ghWriteFile(ACTIVITY_PATH, DB.activityLog);
    persistLocalCache();
    setSyncStatus('Bağlı — güncel','ok');
    renderAll(); // birleştirme sırasında başkalarının verisi de gelmiş olabilir
  }catch(err){
    console.error(err);
    setSyncStatus('Kaydetme hatası','err');
    showToast('Kaydedilemedi: '+err.message);
  }
}

function scheduleSave(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    await pushToGithub();
    await checkNotifications();
  }, 900);
}

async function refreshFromRemote(){
  if(!ghConfig) return;
  await loadFromGithub();
  renderAll();
  checkNotifications();
}

/* ============ kimlik / giriş (kullanıcı adı + şifre) ============ */
function showIdentityGate(){
  const root = document.getElementById('modal-root');
  let mode = 'login'; // 'login' | 'register'

  function render(){
    root.innerHTML = `
      <div class="gate">
        <div class="gate-box">
          <div class="brand-mark">A</div>
          <h2>${mode==='login' ? 'Giriş Yap' : 'Hesap Oluştur'}</h2>
          <p>${mode==='login' ? 'Ekibinin ortak alanına giriş yap.' : 'Ekip alanına katılmak için bir hesap oluştur.'}</p>
          ${mode==='register' ? `
            <div class="field"><label>Ad Soyad</label><input type="text" id="gate-name" placeholder="Örn. Ayşe Yılmaz"></div>
            <div class="field"><label>Unvan <span class="small-note">(isteğe bağlı)</span></label><input type="text" id="gate-title" placeholder="Örn. Çalışan, Tasarımcı…"></div>
          ` : ''}
          <div class="field"><label>Kullanıcı Adı</label><input type="text" id="gate-username" placeholder="kullanici_adi" autocomplete="username"></div>
          <div class="field"><label>Şifre</label><input type="password" id="gate-password" placeholder="••••••••" autocomplete="${mode==='login'?'current-password':'new-password'}"></div>
          ${mode==='register' ? `<div class="field"><label>Şifre (tekrar)</label><input type="password" id="gate-password2" placeholder="••••••••"></div>` : ''}
          <button class="btn btn-primary" id="gate-submit" style="width:100%;justify-content:center;padding:11px;">${mode==='login'?'Giriş Yap':'Hesap Oluştur'}</button>
          ${mode==='login' ? `<p class="field-hint" style="text-align:center;">Yönetici hesabı: <b>admin</b> / <b>admin1234</b></p>` : ''}
          <div class="small-note" style="margin-top:14px;">
            ${mode==='login' ? `Hesabın yok mu? <a href="#" id="gate-switch" style="color:var(--accent);">Kayıt ol</a>` : `Zaten hesabın var mı? <a href="#" id="gate-switch" style="color:var(--accent);">Giriş yap</a>`}
          </div>
        </div>
      </div>`;
    document.getElementById('gate-switch').addEventListener('click', e=>{ e.preventDefault(); mode = mode==='login'?'register':'login'; render(); });
    document.getElementById('gate-submit').addEventListener('click', onSubmit);
    root.querySelectorAll('input').forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key==='Enter') onSubmit(); }));
  }

  async function onSubmit(){
   try{
    const username = document.getElementById('gate-username').value.trim().toLowerCase();
    const password = document.getElementById('gate-password').value;
    if(!username || !password){ showToast('Kullanıcı adı ve şifre gerekli'); return; }

    if(mode==='login'){
      const hash = await hashPassword(password);
      const u = DB.users.find(x=>x.username && x.username.toLowerCase()===username && !x.deleted);
      if(!u || u.passwordHash !== hash){ showToast('Kullanıcı adı ya da şifre hatalı'); return; }
      currentUserId = u.id; setLocalIdentity(u.id);
      logActivity('giris_yapildi', {});
      root.innerHTML=''; scheduleSave(); renderAll(); checkNotifications();
      showToast(`Hoş geldin, ${u.name}`);

    } else {
      const name = document.getElementById('gate-name').value.trim();
      const title = document.getElementById('gate-title').value.trim() || 'Çalışan';
      const password2 = document.getElementById('gate-password2').value;
      if(!name){ showToast('Lütfen adını gir'); return; }
      if(password.length < 4){ showToast('Şifre en az 4 karakter olmalı'); return; }
      if(password !== password2){ showToast('Şifreler eşleşmiyor'); return; }
      if(DB.users.some(x=>x.username && !x.deleted && x.username.toLowerCase()===username)){ showToast('Bu kullanıcı adı zaten alınmış'); return; }
      const now = Date.now();
      const newUser = { id: uid(), username, passwordHash: await hashPassword(password), name, title, isAdmin:false, color: avatarColor(name), createdAt: now, updatedAt: now };
      DB.users.push(newUser);
      currentUserId = newUser.id; setLocalIdentity(newUser.id);
      logActivity('kullanici_olusturuldu', { name });
      markDirty('users');
      root.innerHTML=''; renderAll(); checkNotifications();
      await pushToGithub();
      showToast(`Hoş geldin, ${name}`);
    }
   }catch(err){
     console.error(err);
     showToast('Bir hata oluştu: '+err.message);
   }
  }
  render();
}

async function ensureIdentity(){
  if(!ghConfig){
    document.getElementById('modal-root').innerHTML = '';
    return false;
  }
  if(currentUserId && !userById(currentUserId)){
    // hesabımız listede görünmüyor olabilir — senkron gecikmesi ihtimaline karşı bir kez daha çekip emin ol
    await new Promise(r=>setTimeout(r, 1000));
    await loadFromGithub();
  }
  if(!currentUserId || !userById(currentUserId) || userById(currentUserId).deleted){
    showIdentityGate();
    return false;
  }
  return true;
}

function logout(){
  currentUserId = null;
  localStorage.removeItem(LOCAL_ID_KEY);
  showIdentityGate();
}

/* ============ bildirim / favicon rozet ============ */
function setFaviconBadge(count){
  const canvas = document.createElement('canvas');
  canvas.width=32; canvas.height=32;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#e8a33d'; ctx.beginPath(); ctx.arc(16,16,15,0,7); ctx.fill();
  ctx.fillStyle='#1a1305'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('A',16,17);
  if(count>0){
    ctx.fillStyle='#e5595e'; ctx.beginPath(); ctx.arc(24,8,8,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.fillText(count>9?'9+':String(count),24,9);
  }
  document.getElementById('favicon-link').href = canvas.toDataURL();
}

// herhangi bir öncelikte "seni ilgilendiren, yanıt bekleyen" her şey — zil ikonu için
function pendingItemsForMe(){
  const me = currentUser();
  if(!me) return [];
  const items = [];
  DB.appointments.filter(a=>a.withUserId===me.id && a.status==='pending')
    .forEach(a=>items.push({type:'appointment', id:a.id, urgency:a.urgency, text:`${userById(a.requestedByUserId)?.name||a.requestedByText||'Biri'} seninle ${aptTimeRangeFull(a)} için randevu oluşturdu: “${a.title}”`, data:a}));
  DB.approvals.forEach(ap=>{
    const mine = ap.approvers.find(x=>x.userId===me.id && x.status==='pending');
    if(mine) items.push({type:'approval', id:ap.id+':'+me.id, urgency:ap.urgency, text:`${userById(ap.requesterId)?.name||'Biri'} senden onay istiyor: “${ap.title}”`, data:ap});
  });
  return items.sort((a,b)=> (b.urgency==='urgent')-(a.urgency==='urgent'));
}
function pendingUrgentItemsForMe(){ return pendingItemsForMe().filter(i=>i.urgency==='urgent'); }

function renderNotifDot(){
  const count = pendingItemsForMe().length;
  const dot = document.getElementById('notif-dot');
  if(dot) dot.classList.toggle('show', count>0);
}

function checkNotifications(){
  renderNotifDot();
  const seen = getSeenIds();
  const items = pendingUrgentItemsForMe().filter(i=>!seen.has(i.id));
  setFaviconBadge(items.length);
  const stack = document.getElementById('sticky-stack');
  stack.innerHTML='';
  items.slice(0,4).forEach(item=>{
    const el = document.createElement('div');
    el.className='sticky-note';
    el.innerHTML = `
      <div class="head">🔴 Acil ${item.type==='appointment'?'Randevu Talebi':'Onay Talebi'}</div>
      <p>${esc(item.text)}</p>
      <div class="row">
        ${item.type==='appointment' ? `
          <button class="btn btn-sm btn-success" data-act="apt-accept" data-id="${item.data.id}">Onayla</button>
          <button class="btn btn-sm btn-ghost" data-act="apt-postpone" data-id="${item.data.id}">Ertele</button>
          <button class="btn btn-sm btn-danger" data-act="apt-reject" data-id="${item.data.id}">Reddet</button>
        ` : `
          <button class="btn btn-sm btn-success" data-act="ap-approve" data-id="${item.data.id}">Onayla</button>
          <button class="btn btn-sm btn-danger" data-act="ap-reject" data-id="${item.data.id}">Reddet</button>
        `}
        <button class="btn btn-sm btn-ghost" data-act="dismiss" data-seen="${item.id}">Kapat</button>
      </div>`;
    stack.appendChild(el);
  });
  stack.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const act = btn.dataset.act;
      const id = btn.dataset.id;
      if(act==='dismiss'){ markSeen(btn.dataset.seen); checkNotifications(); return; }
      if(act.startsWith('apt-')){
        const apt = DB.appointments.find(a=>a.id===id);
        if(act==='apt-accept') respondAppointment(apt,'accepted');
        if(act==='apt-postpone') openPostponeModal(apt);
        if(act==='apt-reject') openRejectNoteModal(apt, 'appointment');
      } else {
        const ap = DB.approvals.find(a=>a.id===id);
        if(act==='ap-approve') respondApproval(ap, currentUserId, 'approved');
        if(act==='ap-reject') openRejectNoteModal(ap, 'approval');
      }
    });
  });
}

function tabIcon(icon){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>`; }

// bir kullanıcının "kendi" etkinlik akışı: kendi yaptığı işlemler + görebildiği projelerdeki işlemler
function myActivityEntries(me){
  const myProjectIds = new Set(DB.projects.filter(p=>canSee(p, me.id)).map(p=>p.id));
  return DB.activityLog.filter(l=> l.userId===me.id || (l.meta && l.meta.projectId && myProjectIds.has(l.meta.projectId)));
}

function renderAll(){
  renderTopIdentity();
  renderSubtabs();
  renderContent();
  renderTeamPanel();
}

function renderTopIdentity(){
  const chip = document.getElementById('identity-chip');
  const me = currentUser();
  const adminBtn = document.getElementById('admin-btn');
  if(!me){ chip.innerHTML=''; adminBtn.style.display='none'; return; }
  chip.innerHTML = `<div class="avatar" style="background:${me.color}">${initials(me.name)}</div>
    <div class="who"><b>${esc(me.name)}${me.isAdmin?'<span class="admin-tag">👑 ADMIN</span>':''}</b><span>${esc(me.title)}</span></div>`;
  chip.onclick = ()=> openIdentityEdit();
  chip.style.cursor='pointer';
  adminBtn.style.display = me.isAdmin ? 'flex' : 'none';
}

function renderSubtabs(){
  const wrap = document.getElementById('subtabs');
  const me = currentUser();
  wrap.innerHTML = TABS.map(t=>{
    let count = 0;
    if(!me) count = 0;
    else if(t.key==='projects') count = DB.projects.filter(p=>canSee(p, me.id)).length;
    else if(t.key==='appointments') count = DB.appointments.filter(a=>a.withUserId===me.id || a.requestedByUserId===me.id).length;
    else if(t.key==='approvals') count = DB.approvals.filter(a=>a.requesterId===me.id || a.approvers.some(x=>x.userId===me.id)).length;
    else if(t.key==='notes') count = DB.notes.filter(n=>canSee(n, me.id)).length;
    else if(t.key==='activity') count = myActivityEntries(me).length;
    return `<button class="subtab ${activeTab===t.key?'active':''}" data-tab="${t.key}">${tabIcon(t.icon)}${t.label} <span class="count">${count}</span></button>`;
  }).join('');
  wrap.querySelectorAll('.subtab').forEach(b=> b.onclick = ()=>{ activeTab=b.dataset.tab; searchTerm=''; document.getElementById('search-input').value=''; renderContent(); renderSubtabs(); });
  document.getElementById('new-btn').style.display = activeTab==='activity' ? 'none' : '';
  document.getElementById('new-btn').textContent = {
    projects:'+ Yeni Proje', appointments:'+ Yeni Randevu', approvals:'+ Onay Talebi', notes:'+ Yeni Not'
  }[activeTab];
}

function canSee(item, userId){
  if(item.deleted) return false;
  if(item.visibility==='all' || !item.visibility) return true;
  return item.ownerId===userId || (item.visibleTo||[]).includes(userId);
}

function renderContent(){
  const area = document.getElementById('content-area');
  const me = currentUser();
  if(!me){ area.innerHTML=''; return; }
  if(activeTab==='projects') return renderProjects(area, me);
  if(activeTab==='appointments') return renderAppointments(area, me);
  if(activeTab==='approvals') return renderApprovals(area, me);
  if(activeTab==='notes') return renderNotes(area, me);
  if(activeTab==='activity') return renderMyActivity(area, me);
}

/* ---------- ETKİNLİK (herkesin kendi görebildiği log paneli — proje ekranında log yok) ---------- */
function renderMyActivity(area, me){
  const ACTION_LABELS = {
    giris_yapildi:'giriş yaptı', kullanici_olusturuldu:'hesap oluşturdu',
    proje_olusturuldu:'proje oluşturdu', proje_duzenlendi:'projeyi düzenledi', proje_silindi:'proje sildi',
    dosya_eklendi:'dosya ekledi', dosya_silindi:'dosya sildi',
    randevu_olusturuldu:'randevu önerdi', randevu_yanit:'randevuya yanıt verdi',
    onay_talebi_olusturuldu:'onay talebi oluşturdu', onay_yanit:'onay talebine yanıt verdi',
    not_olusturuldu:'not oluşturdu', not_duzenlendi:'notu düzenledi', not_silindi:'not sildi'
  };
  const entries = myActivityEntries(me).slice().sort((a,b)=>b.at-a.at).slice(0,200);
  if(!entries.length){ area.innerHTML = emptyState('🕓','Henüz etkinlik yok','Sen ya da görebildiğin projelerde biri bir şey yaptığında burada görünecek.'); return; }
  area.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;max-width:640px;">${entries.map(l=>{
    const label = ACTION_LABELS[l.action] || l.action;
    const proj = l.meta && l.meta.projectId ? DB.projects.find(p=>p.id===l.meta.projectId) : null;
    return `<div style="font-size:12.5px;padding:10px 12px;background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;">
      <b>${esc(userById(l.userId)?.name||'—')}</b> ${esc(label)}${proj?` — ${esc(proj.title)}`:''} <span class="small-note">· ${timeAgo(l.at)}</span>
    </div>`;
  }).join('')}</div>`;
}

/* ---------- PROJELER ---------- */
function renderProjects(area, me){
  let list = DB.projects.filter(p=>canSee(p, me.id));
  if(searchTerm) list = list.filter(p=> (p.title+p.desc).toLowerCase().includes(searchTerm.toLowerCase()));
  const hasOrder = list.some(p=>p.order!=null);
  list = list.slice().sort((a,b)=> hasOrder ? ((a.order??1e15)-(b.order??1e15)) : ((b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)));
  if(!list.length){ area.innerHTML = emptyState('📁','Henüz proje yok','İlk projeni oluşturarak başla. Kategoriler, aciliyet seviyesi ve görünürlük ayarlarını sonra ekleyebilirsin.'); return; }
  area.innerHTML = `<div class="grid" id="projects-grid">${list.map(p=>{
    const cover = p.coverFileId ? (p.files||[]).find(f=>f.id===p.coverFileId) : null;
    const body = `
      <div class="card-top"><div class="card-title">${esc(p.title)}</div></div>
      <div class="card-desc">${esc(p.desc||'Açıklama yok')}</div>
      <div class="card-meta">
        <span>${esc(userById(p.ownerId)?.name||'—')}</span>·
        <span>${(p.files||[]).length} dosya</span>·
        <span>${timeAgo(p.updatedAt||p.createdAt)}</span>
      </div>`;
    return `<div class="card ${p.urgency==='urgent'?'urg-urgent':p.urgency==='important'?'urg-important':''} ${cover?'has-cover':''}" data-id="${p.id}">
      ${cover ? `<div class="card-cover" style="background-image:url('${cover.dataUrl}')"></div><div class="card-cover-body">${body}</div>` : body}
    </div>`;
  }).join('')}</div>`;
  setupProjectDragReorder(document.getElementById('projects-grid'));

/* Defter'deki mantığın aynısı: kart basılı tutulup sürüklenince havada bir kopya olarak
   takip eder, bıraktığı yerde bir boşluk (placeholder) açılır, diğer kartlar da FLIP
   tekniğiyle (önce/sonra konumu ölçüp aradaki farkı animasyonla kapatarak) kenara
   kayıp yumuşakça yer açar — tıklamayla açma ile karışmasın diye kısa bir "basılı tut" eşiği var. */
function setupProjectDragReorder(grid){
  const LONG_PRESS_MS = 220, MOVE_CANCEL_PX = 8, REORDER_THROTTLE_MS = 120, SWAP_HYSTERESIS_PX = 22;
  let dragState = null, lastReorderAt = 0;

  function onDragMove(ev){
    if(!dragState || ev.pointerId !== dragState.pointerId) return;
    ev.preventDefault();
    const dx = ev.clientX - dragState.startX, dy = ev.clientY - dragState.startY;
    dragState.card.style.transform = `translate(${dx}px, ${dy}px) scale(1.045)`;
    const now = performance.now();
    if(now - lastReorderAt < REORDER_THROTTLE_MS) return;
    const phBox = dragState.placeholder.getBoundingClientRect();
    const phx = phBox.left+phBox.width/2, phy = phBox.top+phBox.height/2;
    const distToPh = Math.hypot(ev.clientX-phx, ev.clientY-phy);
    const others = [...grid.querySelectorAll('.card')].filter(c=>c!==dragState.card);
    let closest=null, closestDist=Infinity;
    others.forEach(c=>{
      const box=c.getBoundingClientRect(); const cx=box.left+box.width/2, cy=box.top+box.height/2;
      const dist=Math.hypot(ev.clientX-cx, ev.clientY-cy);
      if(dist<closestDist){ closestDist=dist; closest=c; }
    });
    if(closest && closestDist < distToPh - SWAP_HYSTERESIS_PX){
      lastReorderAt = now;
      const flipTargets = [...grid.children].filter(c=>c!==dragState.card);
      const firstRects = new Map(flipTargets.map(c=>[c, c.getBoundingClientRect()]));
      const all = [...grid.children];
      const phIdx = all.indexOf(dragState.placeholder), tgtIdx = all.indexOf(closest);
      if(phIdx<tgtIdx) grid.insertBefore(dragState.placeholder, closest.nextSibling);
      else grid.insertBefore(dragState.placeholder, closest);
      flipTargets.forEach(c=>{
        const first=firstRects.get(c), last=c.getBoundingClientRect();
        const ddx=first.left-last.left, ddy=first.top-last.top;
        if(ddx||ddy){
          c.style.transition='none'; c.style.transform=`translate(${ddx}px,${ddy}px)`;
          requestAnimationFrame(()=>{ c.style.transition='transform .18s var(--ease-spring)'; c.style.transform=''; });
        }
      });
    }
  }
  function onDragEnd(ev){
    if(!dragState || ev.pointerId !== dragState.pointerId) return;
    const { card, placeholder, pointerId } = dragState;
    const floatingRect = card.getBoundingClientRect();
    grid.insertBefore(card, placeholder);
    grid.removeChild(placeholder);
    card.classList.remove('dragging-float');
    card.style.position=''; card.style.left=''; card.style.top=''; card.style.width=''; card.style.height='';
    card.style.transition='none';
    const finalRect = card.getBoundingClientRect();
    const ddx = floatingRect.left-finalRect.left, ddy = floatingRect.top-finalRect.top;
    card.style.transform = `translate(${ddx}px, ${ddy}px) scale(1.045)`;
    requestAnimationFrame(()=>{ card.style.transition='transform .24s var(--ease-spring)'; card.style.transform=''; });
    setTimeout(()=>{ card.style.transition=''; }, 280);
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragEnd);
    try{ card.releasePointerCapture(pointerId); }catch(err){}
    card.style.touchAction = '';
    card.dataset.justDragged = '1';
    dragState = null;

    [...grid.querySelectorAll('.card')].forEach((el,i)=>{
      const proj = DB.projects.find(x=>x.id===el.dataset.id);
      if(proj && proj.order!==i){ proj.order=i; proj.updatedAt=Date.now(); }
    });
    markDirty('projects'); scheduleSave();
  }
  function activateDrag(card, pointerId, startX, startY){
    try{ card.setPointerCapture(pointerId); }catch(err){}
    if(navigator.vibrate) navigator.vibrate(10);
    const rect = card.getBoundingClientRect();
    const placeholder = document.createElement('div');
    placeholder.className = 'card-placeholder';
    placeholder.style.width = rect.width+'px'; placeholder.style.height = rect.height+'px';
    grid.insertBefore(placeholder, card);
    card.classList.add('dragging-float');
    card.style.width = rect.width+'px'; card.style.height = rect.height+'px';
    card.style.left = rect.left+'px'; card.style.top = rect.top+'px';
    card.style.touchAction = 'none';
    card.style.transition = 'box-shadow .12s ease, transform .12s ease';
    card.style.transform = 'scale(1.045)';
    dragState = { card, placeholder, pointerId, startX, startY };
    document.addEventListener('pointermove', onDragMove, {passive:false});
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragEnd);
  }
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{ if(card.dataset.justDragged){ delete card.dataset.justDragged; return; } openProjectDetail(card.dataset.id); });
    card.addEventListener('pointerdown', e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      const startX=e.clientX, startY=e.clientY, pointerId=e.pointerId;
      let done=false;
      const timer = setTimeout(()=>{ if(done) return; done=true; cleanup(); activateDrag(card, pointerId, startX, startY); }, LONG_PRESS_MS);
      function onMove(ev){
        if(ev.pointerId!==pointerId || done) return;
        if(Math.hypot(ev.clientX-startX, ev.clientY-startY) > MOVE_CANCEL_PX){ done=true; clearTimeout(timer); cleanup(); }
      }
      function onUp(ev){ if(ev.pointerId!==pointerId || done) return; done=true; clearTimeout(timer); cleanup(); }
      function cleanup(){ document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp); document.removeEventListener('pointercancel', onUp); }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}
